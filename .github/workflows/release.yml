name: Release

# On every push to main, release if changelog.d gained a fragment since the
# last tag. The version is the last tag bumped by the highest `bump:` level
# among those fragments (see changelog.d/README.md); nothing is committed
# back to main. Run manually to release what is already on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dynamic-terrain-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          last_tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$last_tag" ]; then
            last="${last_tag#v}"
            fragments=$(git diff --name-only --diff-filter=A "$last_tag" HEAD -- changelog.d | grep -v '/README.md$' | grep '\.md$' || true)
          else
            last="0.0.0"
            fragments=$(git ls-files changelog.d | grep -v '/README.md$' | grep '\.md$' || true)
          fi
          if [ -z "$fragments" ]; then
            echo "No new changelog fragments since ${last_tag:-the start}; nothing to release."
            exit 0
          fi
          # shellcheck disable=SC2086
          python3 scripts/next_version.py "$last" $fragments > release-info.txt
          version=$(head -n1 release-info.txt)
          tail -n +2 release-info.txt > release-notes.md
          echo "Releasing $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        if: steps.version.outputs.value
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test
        if: steps.version.outputs.value
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./gradlew build --no-daemon "-Pmod_version=$VERSION"

      - name: Publish GitHub release
        if: steps.version.outputs.value
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v$VERSION" "build/libs/dynamicterrain-$VERSION.jar" \
            --target "$GITHUB_SHA" --title "dynamic-terrain $VERSION" --notes-file release-notes.md
