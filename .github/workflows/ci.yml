name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts

      - name: Check the mod does not require a newer NeoForge than the pack runs
        run: python3 scripts/check_neoforge_floor.py

      # MINECRAFT-499: layered-slopes has no public release yet (only its pre-extraction v0.1.0
      # scaffold, which must never be pinned here). Review comment 52571 explicitly authorizes
      # paired hosted validation against the exact paired PR commit before a release exists, while
      # keeping gradle.properties' real version+sha512 pin fail-closed for actual shipped
      # consumers (see build.gradle's downloadLayeredSlopes). Remove this paired-checkout step and
      # drop -PlayeredslopesLocalJar once that PR merges and releases and gradle.properties is
      # updated to the real pin.
      - name: Checkout paired Layered Slopes PR (MINECRAFT-499 integration validation)
        uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/layered-slopes
          ref: minecraft-499-extract-layered-blocks
          path: layered-slopes-paired

      - name: Build paired Layered Slopes
        run: cd layered-slopes-paired && ./gradlew build --no-daemon

      - name: Build and test (against paired Layered Slopes PR artifact)
        run: ./gradlew build --no-daemon -PlayeredslopesLocalJar=layered-slopes-paired/build/libs/layeredslopes-0.0.0.jar

      # MINECRAFT-499 / Wroosbit review 52656: coinstalled runtime proof, not just compile-time,
      # that this mod actually boots together with Layered Slopes. Gradle reports BUILD SUCCESSFUL
      # even when the GameTest server fails to start or ran zero tests, so check_gametest_count.py
      # fails closed unless the exact expected count of named tests actually ran and passed.
      - name: Run GameTests (coinstalled with paired Layered Slopes PR artifact)
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon -PlayeredslopesLocalJar=layered-slopes-paired/build/libs/layeredslopes-0.0.0.jar 2>&1 | tee gametest.log
          python3 scripts/check_gametest_count.py gametest.log

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-terrain
          path: build/libs/*.jar
          if-no-files-found: error

  release-gate:
    uses: brooswit-factory/release-gate/.github/workflows/gate.yml@v1
    with:
      gated-paths: '["^src/"]'
      version-file: 'gradle.properties'

  # MINECRAFT-499 / Wroosbit gap 1 (John's 18:58 direction): a fresh-placement registry lookup is
  # not proof that a world saved by the pre-extraction, monolithic Dynamic Terrain still resolves
  # once reopened with the split pair. Boots the actual pre-extraction build (this branch's merge
  # base with main) as a dedicated server, places representative layered blocks, saves to disk;
  # then boots the actual split-pair build against that same saved world and reads the blocks back
  # over RCON. No client needed -- this is a server-side save/reload upgrade proof.
  legacy-save-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Checkout paired Layered Slopes PR (MINECRAFT-499 integration validation)
        uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/layered-slopes
          ref: minecraft-499-extract-layered-blocks
          path: layered-slopes-paired

      - name: Build paired Layered Slopes
        run: cd layered-slopes-paired && ./gradlew build --no-daemon

      - name: Checkout pre-extraction Dynamic Terrain as a separate worktree
        run: |
          git fetch origin main
          BASE=$(git merge-base origin/main HEAD)
          echo "Pre-extraction base: $BASE"
          git worktree add ../old-dt "$BASE"

      - name: Run legacy save/reload acceptance
        run: |
          python3 tools/legacy-save/legacy_save_acceptance.py ../old-dt . \
            -PlayeredslopesLocalJar=layered-slopes-paired/build/libs/layeredslopes-0.0.0.jar

      - name: Preserve legacy save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-save-acceptance
          path: |
            legacy-save-*.log
            legacy-save-acceptance-result.json
          if-no-files-found: warn
